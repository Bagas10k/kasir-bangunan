name: tokobangunan01

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: tbg01_app:latest
  restart: unless-stopped
  working_dir: /app
  env_file: .env
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - tbg01_net

services:
  mysql:
    image: mysql:8.0
    container_name: tbg01_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --default-time-zone=+07:00
      --innodb-buffer-pool-size=256M
      --max_allowed_packet=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
      MYSQL_DATABASE: ${DB_DATABASE:-db_tokobangunan01}
      MYSQL_USER: ${DB_USERNAME:-tbg01_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      TZ: Asia/Jakarta
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - tbg01_net

  app:
    <<: *app-base
    container_name: tbg01_app
    environment:
      # Migrasi TIDAK pernah otomatis. Jalankan scripts/deploy.sh atau manage.sh migrate.
      RUN_MIGRATIONS_ON_STARTUP: "false"
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - storage_data:/app/storage/app/public
      - logs_data:/app/storage/logs
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 60

  worker:
    <<: *app-base
    container_name: tbg01_worker
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    environment:
      RUN_MIGRATIONS_ON_STARTUP: "false"
      APP_ENV: ${APP_ENV:-production}
    volumes:
      - storage_data:/app/storage/app/public
      - logs_data:/app/storage/logs
    healthcheck:
      disable: true

  web:
    image: nginx:alpine
    container_name: tbg01_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8091}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public
      - storage_data:/app/public/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      tbg01_net: {}
      # Jaringan proxy bersama untuk Cloudflare Tunnel.
      # Alias WAJIB unik: jangan pakai "web" atau "app" (dipakai proyek lain di VPS ini).
      jaringan_proxy_bersama:
        aliases:
          - tbg01_web

networks:
  tbg01_net:
    name: tbg01_net
  jaringan_proxy_bersama:
    external: true

volumes:
  mysql_data:
    name: tbg01_mysql_data
  storage_data:
    name: tbg01_storage
  logs_data:
    name: tbg01_logs
