name: kasir-bangunan-stage

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - kasir_bangunan_stage_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: kasir-mysql-test:local
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18732:8000"
    volumes:
      - /home/ubuntu/kasir-bangunan-app:/app:ro
    tmpfs:
      - /tmp:rw,exec
      - /app/storage/framework/sessions:rw,exec
      - /app/storage/framework/views:rw,exec
      - /app/storage/framework/cache:rw,exec
      - /app/storage/logs:rw,exec
      - /app/bootstrap/cache:rw,exec
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: staging
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:18732
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_COOKIE: kasir_bangunan_stage_session
      SESSION_PATH: /
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
    command: ["php", "-S", "0.0.0.0:8000", "-t", "public"]

volumes:
  kasir_bangunan_stage_db:
    name: kasir_bangunan_stage_db
