name: kasir-bangunan-demo

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: kasir_bangunan_demo
      MARIADB_USER: kasir_demo
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?missing}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?missing}
    volumes:
      - kasir_bangunan_demo_db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: kasir-php-fpm:local
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /home/ubuntu/kasir-bangunan-app:/app:ro
    tmpfs:
      - /tmp:rw,exec
      - /app/storage/framework/sessions:rw,exec,uid=33,gid=33,mode=0770
      - /app/storage/framework/views:rw,exec,uid=33,gid=33,mode=0770
      - /app/storage/framework/cache:rw,exec,uid=33,gid=33,mode=0770
      - /app/storage/logs:rw,exec,uid=33,gid=33,mode=0770
      - /app/bootstrap/cache:rw,exec,uid=33,gid=33,mode=0770
    environment:
      APP_NAME: "Kasir Bangunan Demo"
      APP_ENV: demo
      APP_KEY: ${APP_KEY:?missing}
      APP_DEBUG: "false"
      APP_URL: http://100.108.213.53:18734
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: kasir_bangunan_demo
      DB_USERNAME: kasir_demo
      DB_PASSWORD: ${MARIADB_PASSWORD:?missing}
      SESSION_DRIVER: database
      SESSION_COOKIE: kasir_bangunan_demo_session
      SESSION_PATH: /
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "100.108.213.53:18734:8080"
    volumes:
      - /home/ubuntu/kasir-bangunan-app:/app:ro
      - /home/ubuntu/kasir-bangunan-app/deploy/production/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  kasir_bangunan_demo_db:
    name: kasir_bangunan_demo_db
