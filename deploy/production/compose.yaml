name: kasir-bangunan-prod

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?missing}
      MARIADB_USER: ${MARIADB_USER:?missing}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?missing}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?missing}
    volumes:
      - kasir_bangunan_prod_db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: php.Dockerfile
    image: kasir-php-fpm:local
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /home/ubuntu/kasir-bangunan-app:/app:ro
    tmpfs:
      - /tmp:rw,exec
      - /app/storage/framework/sessions:rw,exec,uid=33,gid=33,mode=0770
      - /app/storage/framework/views:rw,exec,uid=33,gid=33,mode=0770
      - /app/storage/framework/cache:rw,exec,uid=33,gid=33,mode=0770
      - /app/storage/logs:rw,exec,uid=33,gid=33,mode=0770
      - /app/bootstrap/cache:rw,exec,uid=33,gid=33,mode=0770
    environment:
      APP_NAME: ${APP_NAME:?missing}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?missing}
      APP_DEBUG: "false"
      APP_URL: https://www.jajandigital.web.id/kasir-bangunan
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?missing}
      DB_USERNAME: ${DB_USERNAME:?missing}
      DB_PASSWORD: ${DB_PASSWORD:?missing}
      SESSION_DRIVER: database
      SESSION_COOKIE: kasir_bangunan_prod_session
      SESSION_PATH: /kasir-bangunan
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:18733:8080"
    volumes:
      - /home/ubuntu/kasir-bangunan-app:/app:ro
      - /home/ubuntu/kasir-bangunan-app/deploy/production/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  kasir_bangunan_prod_db:
    name: kasir_bangunan_prod_db
